name: Android build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      # Empty selects Google's test rewarded unit in nativeAdMob.js.
      VITE_ADMOB_REWARDED_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build:android
      - name: Run regression tests
        run: node --experimental-vm-modules --test tests/*.test.js
      - name: Check API syntax
        run: node --check api/_auth.js && node --check api/transcribe-image.js && node --check api/sync-lyrics.js
      - name: Add native AdMob bridge for Android build
        run: npm install --no-save @capacitor-community/admob@^8.0.0
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sigidrigi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
